services:
  db:
    image: postgres:16-alpine
    container_name: rsw-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rsw
      POSTGRES_PASSWORD: rsw
      POSTGRES_DB: rsw
    ports:
      - "5432:5432"
    volumes:
      - rsw-pgdata:/var/lib/postgresql/data

volumes:
  rsw-pgdata:
