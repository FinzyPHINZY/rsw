# RSW reverse proxy — replace rsw.example with your domain.
proxy_cache_path /var/cache/nginx/rsw levels=1:2 keys_zone=rsw_cache:10m max_size=200m inactive=60s;

upstream rsw_app { server 127.0.0.1:3000; }

server {
    listen 80;
    server_name rsw.example www.rsw.example;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name rsw.example www.rsw.example;

    ssl_certificate     /etc/letsencrypt/live/rsw.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rsw.example/privkey.pem;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    client_max_body_size 6m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Long-cache immutable assets and uploads.
    location /_next/static/ {
        proxy_pass http://rsw_app;
        proxy_cache rsw_cache;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /uploads/ {
        proxy_pass http://rsw_app;
        add_header Cache-Control "public, max-age=86400";
    }

    # Micro-cache anonymous HTML; bypass when an auth cookie is present.
    location / {
        proxy_pass http://rsw_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache rsw_cache;
        proxy_cache_valid 200 10s;
        proxy_cache_bypass $cookie_authjs_session_token $http_authorization;
        proxy_no_cache    $cookie_authjs_session_token $http_authorization;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
